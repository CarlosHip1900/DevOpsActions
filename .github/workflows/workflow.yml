name: University Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Can execute Gradle
        run: chmod +x gradlew

      - name: Check Java
        run: java --version

      - name: Build
        run: ./gradlew build


  deliver:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Build application
        run: ./gradlew build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devopsactions:latest \
            -t ghcr.io/${{ github.repository_owner }}/devopsactions:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devopsactions:latest
          docker push ghcr.io/${{ github.repository_owner }}/devopsactions:${{ github.sha }}


  deploy:
    needs: deliver
    runs-on: ubuntu-latest

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/devopsactions:latest

      - name: Run Docker container
        run: |
          docker run \
            --name DevOpsActions \
            ghcr.io/${{ github.repository_owner }}/devopsactions:latest

      - name: Check container
        run: docker ps -a