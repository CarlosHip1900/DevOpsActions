name: University Workflow

on:
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Check Java
        run: java --version

      - name: Build
        run: ./gradlew build


  deliver:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Build application
        run: ./gradlew build

      - name: Build Docker image
        run: docker build -t devopsactions:latest .

      - name: Save Docker image
        run: docker save devopsactions:latest -o devopsactions.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: devopsactions-docker-image
          path: devopsactions.tar


  deploy:
    needs: deliver
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: devopsactions-docker-image

      - name: Load Docker image
        run: docker load -i devopsactions.tar

      - name: Run container
        run: docker run --name DevOpsActions devopsactions:latest

      - name: Check container
        run: docker ps -a